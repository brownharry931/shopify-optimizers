# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "SpeedBoost"
handle = "speedboost-v2-1"
application_url = "https://speedboost.onrender.com"
embedded = true
client_id = "95dba75f7cf5b176583299bbe8bfa6c2"

[app_proxy]
url = "/proxy"
subpath = "speedboost"
prefix = "apps"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Only what the code uses: themes (embed detection, draft-theme optimizer)
# and the app proxy (storefront heartbeat). Shop info and app-installation
# metafields need no scope.
scopes = "read_themes,write_themes,write_app_proxy"
optional_scopes = [ ]
use_legacy_install_flow = false

# Required from December 1, 2026 for apps with a theme app extension, an app
# proxy or write_themes. The storefront runtime loads embed.js from Shopify's
# CDN and only calls the app proxy on the store's own domain, so it contacts
# no external servers. Add an https origin here if that ever changes.
[network_access]
allowed_sources = []

[auth]
redirect_urls = [ "https://speedboost.onrender.com/auth/callback" ]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[build]
automatically_update_urls_on_dev = true
