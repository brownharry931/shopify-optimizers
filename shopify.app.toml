# Link this manifest to the existing public SpeedBoost app with `shopify app config link`.
# Never put the API secret here.
name = "SpeedBoost"
application_url = "https://speedboost.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
# Least privilege. read_themes is required only for theme-aware onboarding.
scopes = "read_themes"

[auth]
redirect_urls = ["https://speedboost.onrender.com/auth/callback"]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  # Mandatory privacy-law compliance webhooks for public apps.
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]
