services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename}:cached
    working_dir: /workspaces/${localWorkspaceFolderBasename}
    environment:
      DATABASE_URL: postgresql://performance:performance@postgres:5432/performance_pro
      SCOPES: ""
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: performance
      POSTGRES_PASSWORD: performance
      POSTGRES_DB: performance_pro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U performance -d performance_pro"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
